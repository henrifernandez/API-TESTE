<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console de Requisições</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070d;
            --panel: rgba(12, 17, 28, .72);
            --line: rgba(120, 220, 232, .16);
            --text: #e6f1f5;
            --muted: #7f93a1;
            --accent: #3df0d2;
            --accent-2: #ffb454;
            --danger: #ff6b6b;
        }
        * { box-sizing: border-box; margin: 0; }
        html, body { height: 100%; }
        body {
            background: radial-gradient(1200px 700px at 75% 40%, #0b1626 0%, var(--bg) 70%);
            color: var(--text);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            overflow-x: hidden;
        }
        #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

        main {
            position: relative; z-index: 1;
            min-height: 100%;
            display: grid;
            grid-template-columns: minmax(320px, 460px) 1fr;
            gap: 32px;
            padding: clamp(20px, 4vw, 56px);
            pointer-events: none;
        }
        .panel {
            pointer-events: auto;
            align-self: center;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 32px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
        }
        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; letter-spacing: .08em;
            color: var(--accent);
            display: flex; align-items: center; gap: 8px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
        .dot.busy { background: var(--accent-2); box-shadow: 0 0 12px var(--accent-2); }
        h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.05; margin: 14px 0 10px; letter-spacing: -.02em; }
        .lead { color: var(--muted); font-size: 15px; line-height: 1.55; max-width: 44ch; }

        .actions { display: grid; gap: 10px; margin-top: 26px; }
        button {
            font: inherit; color: var(--text); cursor: pointer;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, .03);
            border: 1px solid var(--line);
            border-radius: 12px;
            transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
        }
        button:hover { border-color: var(--accent); background: rgba(61, 240, 210, .07); transform: translateX(4px); }
        button:active { transform: translateX(4px) scale(.98); }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        button:disabled { opacity: .55; cursor: progress; }
        button .label { font-weight: 500; }
        button .path { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
        button.image-btn { border-color: rgba(255, 180, 84, .35); }
        button.image-btn:hover { border-color: var(--accent-2); background: rgba(255, 180, 84, .08); }
        .sep { height: 1px; background: var(--line); margin: 6px 0; }

        .terminal {
            margin-top: 22px;
            font-family: 'JetBrains Mono', monospace; font-size: 14px;
            background: rgba(0, 0, 0, .35);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            min-height: 92px;
        }
        .terminal .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .terminal .status.ok { color: var(--accent); }
        .terminal .status.err { color: var(--danger); }
        #resultado { white-space: pre-wrap; line-height: 1.5; }
        .caret::after { content: '▍'; color: var(--accent); animation: blink 1s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Visualizador de imagem */
        .stage {
            pointer-events: none;
            display: grid; place-items: center;
            transition: transform .15s ease-out;
        }
        .frame {
            position: relative;
            width: min(620px, 90vw, 78vh);
            aspect-ratio: 1 / 1;
            display: grid; place-items: center;
            visibility: hidden;
        }
        .frame.on { visibility: visible; }
                .aura, .ring, .orbit { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; }
        .aura { inset: -14%; background: radial-gradient(circle, rgba(255,180,84,.55), rgba(61,240,210,.28) 45%, transparent 70%); filter: blur(30px); }
        .ring { inset: -2.2%; background: conic-gradient(from 0deg, #3df0d2, #ffb454, #ff4fa3, #7a5cff, #3df0d2);
                -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
                        mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); }
        .ring.glow { filter: blur(14px);
                -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 22px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 22px), #000 calc(100% - 4px)); }
        .orbit { inset: -9%; }
        .orbit i { position: absolute; top: -5px; left: calc(50% - 5px); width: 10px; height: 10px; border-radius: 50%;
                   background: var(--c); box-shadow: 0 0 14px 4px var(--c); }
        .frame.on .aura { opacity: 1; animation: breathe 2.6s ease-in-out infinite; }
        .frame.on .ring { opacity: 1; animation: spin 5s linear infinite; }
        .frame.on .orbit { opacity: 1; animation: spin var(--t) linear infinite; }
        .frame.on .orbit.rev { animation-direction: reverse; }
        .frame.off .aura, .frame.off .ring, .frame.off .orbit { opacity: 0; transition: opacity .35s; animation: none; }
        .frame.on { animation: float 5s ease-in-out infinite; }
        .frame.off { animation: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes breathe { 50% { transform: scale(1.08); opacity: .75; } }
        @keyframes float { 50% { translate: 0 -10px; } }
        .photo {
            pointer-events: auto;
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 0;
            background: #0a0f18 42% 58% / 118% no-repeat; /* recorta o fundo cinza e enquadra no círculo */
            box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 40px 90px rgba(0,0,0,.6), 0 0 80px rgba(255, 180, 84, .18);
            opacity: 0;
            clip-path: inset(50% 50% 50% 50% round 50%);
            transform: translateY(40px) rotateX(18deg) scale(.9);
            overflow: hidden;
        }
        .photo.show { animation: reveal 1s cubic-bezier(.2, .8, .2, 1) forwards; }
        .photo.hide { animation: conceal .45s cubic-bezier(.5, 0, .75, 0) forwards; }
        .photo::after { /* varredura de luz ao abrir */
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%);
            transform: translateX(-120%);
        }
        .photo.show::after { animation: sweep 1.2s .55s ease-out forwards; }
        .photo .fallback {
            position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px;
            font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); line-height: 1.6;
        }
        .photo.missing .fallback { display: grid; }
        .photo .close {
            position: absolute; bottom: 7%; left: 50%; margin-left: -34px; z-index: 2;
            padding: 6px 10px; font-size: 12px; background: rgba(5,7,13,.7); transform: none !important;
        }
        @keyframes reveal {
            0%   { opacity: 0; clip-path: inset(50% 50% 50% 50% round 50%); transform: translateY(40px) rotateX(18deg) scale(.9); filter: brightness(3) saturate(0); }
            35%  { opacity: 1; clip-path: inset(46% 0 46% 0 round 50%); filter: brightness(2) hue-rotate(90deg) saturate(2); }
            60%  { filter: brightness(1.4) hue-rotate(-40deg) saturate(1.6); transform: translateY(0) rotateX(0) scale(1.06) skewX(-3deg); }
            100% { opacity: 1; clip-path: inset(0 0 0 0 round 50%); transform: translateY(0) rotateX(0) scale(1); filter: none; }
        }
        @keyframes conceal {
            to { opacity: 0; clip-path: inset(50% 50% 50% 50% round 50%); transform: translateY(20px) scale(.92); }
        }
        @keyframes sweep { to { transform: translateX(120%); } }

        @media (max-width: 860px) {
            main { grid-template-columns: 1fr; }
            .stage { order: -1; }
            .panel { padding: 22px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::after { animation-duration: .01s !important; transition-duration: .01s !important; }
        }
    </style>
</head>
<body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <main>
        <section class="panel">
            <div class="eyebrow"><span class="dot" id="led"></span><span id="estado">PRONTO PARA REQUISITAR</span></div>
            <h1>Console de requisições</h1>
            <p class="lead">Escolha um arquivo e veja o pacote sair do cliente, atravessar a rede e voltar com a resposta.</p>

            <div class="actions">
                <button data-file="mensagem.txt"><span class="label">Buscar mensagem 1</span><span class="path">mensagem.txt</span></button>
                <button data-file="mensagem2.txt"><span class="label">Buscar mensagem 2</span><span class="path">mensagem2.txt</span></button>
                <button data-file="mensagem3.txt"><span class="label">Buscar mensagem 3</span><span class="path">mensagem3.txt</span></button>
                <div class="sep"></div>
                <button class="image-btn" id="btnImagem"><span class="label">Mostrar imagem</span><span class="path">imagem.jpg</span></button>
            </div>

            <div class="terminal" aria-live="polite">
                <div class="meta"><span id="alvo">GET —</span><span class="status" id="codigo">aguardando</span></div>
                <p id="resultado"></p>
            </div>
        </section>

        <section class="stage">
            <div class="frame" id="frame">
                <div class="aura"></div>
                <div class="ring glow"></div>
                <div class="ring"></div>
                <div class="orbit" style="--t:7s"><i style="--c:#3df0d2"></i></div>
                <div class="orbit rev" style="--t:11s;inset:-16%"><i style="--c:#ffb454"></i></div>
                <div class="orbit" style="--t:15s;inset:-23%"><i style="--c:#ff4fa3"></i></div>
                <div class="photo" id="foto" role="img" aria-label="Imagem carregada">
                    <button class="close" id="fechar">Fechar</button>
                    <div class="fallback">Coloque o arquivo<br><strong>imagem.jpg</strong><br>na mesma pasta do index.html</div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /* ====== Configuração ====== */
        const ARQUIVO_IMAGEM = 'imagem.jpg'; // troque aqui se usar outro nome/extensão

        /* ====== Cena Three.js (a interface funciona mesmo se a CDN falhar) ====== */
        let animarRequisicao = cb => setTimeout(cb, 700), explosaoImagem = () => {};
        if (window.THREE) {
        const canvas = document.getElementById('scene');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05070d, 0.045);
        const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
        camera.position.set(0, 0, 11);

        const ACCENT = 0x3df0d2, AMBER = 0xffb454;
        const world = new THREE.Group();
        scene.add(world);

        // Servidor: núcleo wireframe + casca interna
        const core = new THREE.Group();
        const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(1.7, 1),
            new THREE.MeshBasicMaterial({ color: ACCENT, wireframe: true, transparent: true, opacity: .75 }));
        const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(.9, 0),
            new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, opacity: .25 }));
        core.add(shell, inner);
        core.position.set(4.2, 0, 0);
        world.add(core);

        // Cliente: octaedro
        const client = new THREE.Mesh(new THREE.OctahedronGeometry(.8, 0),
            new THREE.MeshBasicMaterial({ color: AMBER, wireframe: true }));
        client.position.set(-4.6, 0, 0);
        world.add(client);

        // Anéis orbitais do servidor
        const rings = [0, 1].map(i => {
            const r = new THREE.Mesh(new THREE.TorusGeometry(2.6 + i * .6, .012, 8, 120),
                new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, opacity: .35 }));
            r.rotation.x = Math.PI / 2.4 + i * .6;
            core.add(r);
            return r;
        });

        // Poeira de dados ao fundo
        const N = 900, pos = new Float32Array(N * 3);
        for (let i = 0; i < N; i++) {
            pos[i*3] = (Math.random() - .5) * 40;
            pos[i*3+1] = (Math.random() - .5) * 24;
            pos[i*3+2] = (Math.random() - .5) * 30 - 4;
        }
        const dustGeo = new THREE.BufferGeometry();
        dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x7fd8e6, size: .05, transparent: true, opacity: .6 }));
        scene.add(dust);

        // Cabo entre cliente e servidor
        const path = new THREE.CatmullRomCurve3([
            client.position.clone(),
            new THREE.Vector3(-1.5, 1.4, 1),
            new THREE.Vector3(1.2, -1.2, -1),
            core.position.clone()
        ]);
        world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(path.getPoints(80)),
            new THREE.LineBasicMaterial({ color: ACCENT, transparent: true, opacity: .18 })));

        // Pacotes + ondas de choque (criados sob demanda)
        const packets = [], waves = [];
        let pulse = 0, imageBurst = 0;

        function enviarPacote(cor, direcao, aoChegar) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(.14, 12, 12), new THREE.MeshBasicMaterial({ color: cor }));
            const trail = [];
            for (let i = 0; i < 14; i++) {
                const t = new THREE.Mesh(new THREE.SphereGeometry(.1 * (1 - i / 16), 8, 8),
                    new THREE.MeshBasicMaterial({ color: cor, transparent: true, opacity: .5 * (1 - i / 14) }));
                world.add(t); trail.push(t);
            }
            world.add(m);
            packets.push({ m, trail, t: 0, dir: direcao, aoChegar, hist: [] });
        }

        function onda(posicao, cor) {
            const w = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 64),
                new THREE.MeshBasicMaterial({ color: cor, transparent: true, opacity: .9, side: THREE.DoubleSide }));
            w.position.copy(posicao);
            world.add(w);
            waves.push({ w, t: 0 });
        }

        // Ciclo completo: cliente -> servidor -> cliente
        animarRequisicao = function (aoResponder) {
            enviarPacote(AMBER, 1, () => {
                pulse = 1;
                onda(core.position, ACCENT);
                enviarPacote(ACCENT, -1, aoResponder);
            });
        }

        const BURST = 260, bPos = new Float32Array(BURST * 3), bVel = [];
        const bGeo = new THREE.BufferGeometry();
        bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
        const bMat = new THREE.PointsMaterial({ color: 0xffd08a, size: .12, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
        const burst = new THREE.Points(bGeo, bMat);
        scene.add(burst);
        let burstT = 1;
        function dispararParticulas() {
            burstT = 0;
            for (let i = 0; i < BURST; i++) {
                const a = Math.random() * Math.PI * 2, b = Math.acos(2 * Math.random() - 1), v = 3 + Math.random() * 7;
                bPos.set([0, 0, 0], i * 3);
                bVel[i] = [Math.sin(b) * Math.cos(a) * v, Math.sin(b) * Math.sin(a) * v, Math.cos(b) * v];
            }
        }
        explosaoImagem = function () {
            dispararParticulas();
            imageBurst = 1;
            onda(new THREE.Vector3(0, 0, 0), AMBER);
            setTimeout(() => onda(new THREE.Vector3(0, 0, 0), ACCENT), 160);
        }

        /* ====== Loop ====== */
        const mouse = { x: 0, y: 0 };
        addEventListener('pointermove', e => {
            mouse.x = e.clientX / innerWidth - .5;
            mouse.y = e.clientY / innerHeight - .5;
        });

        const clock = new THREE.Clock();
        function loop() {
            const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;

            core.rotation.y += dt * .25;
            core.rotation.x += dt * .08;
            rings[0].rotation.z += dt * .4;
            rings[1].rotation.z -= dt * .3;
            client.rotation.y += dt * .5;
            dust.rotation.y += dt * .01;

            pulse = Math.max(0, pulse - dt * 1.6);
            imageBurst = Math.max(0, imageBurst - dt * 1.1);
            core.scale.setScalar(1 + pulse * .35 + Math.sin(time * 1.5) * .02);
            inner.material.opacity = .25 + pulse * .6;
            shell.material.opacity = .75 + pulse * .25;
            shell.material.color.setHex(pulse > .02 ? 0xffffff : ACCENT);

            // pacotes
            for (let i = packets.length - 1; i >= 0; i--) {
                const p = packets[i];
                p.t += dt / 1.1;
                const u = Math.min(p.t, 1), e = u * u * (3 - 2 * u);
                const pt = path.getPoint(p.dir === 1 ? e : 1 - e);
                p.m.position.copy(pt);
                p.hist.unshift(pt.clone());
                p.hist.length = Math.min(p.hist.length, p.trail.length * 2);
                p.trail.forEach((tr, k) => { if (p.hist[k * 2]) tr.position.copy(p.hist[k * 2]); });
                if (p.t >= 1) {
                    world.remove(p.m); p.trail.forEach(tr => world.remove(tr));
                    packets.splice(i, 1);
                    p.aoChegar && p.aoChegar();
                }
            }
            // partículas da imagem
            if (burstT < 1) {
                burstT += dt / 1.8;
                for (let i = 0; i < BURST; i++) {
                    bPos[i*3] += bVel[i][0] * dt; bPos[i*3+1] += bVel[i][1] * dt; bPos[i*3+2] += bVel[i][2] * dt;
                    bVel[i][0] *= .985; bVel[i][1] *= .985; bVel[i][2] *= .985;
                }
                bGeo.attributes.position.needsUpdate = true;
                bMat.opacity = Math.max(0, 1 - burstT);
                bMat.color.setHSL((time * .4) % 1, .9, .65);
            }
            // ondas
            for (let i = waves.length - 1; i >= 0; i--) {
                const o = waves[i];
                o.t += dt / 1.2;
                const s = 1 + o.t * 9;
                o.w.scale.set(s, s, s);
                o.w.material.opacity = Math.max(0, .9 * (1 - o.t));
                o.w.lookAt(camera.position);
                if (o.t >= 1) { world.remove(o.w); waves.splice(i, 1); }
            }

            // câmera acompanha o mouse; pequeno tranco quando a imagem abre
            camera.position.x += (mouse.x * 2 - camera.position.x) * .04;
            camera.position.y += (-mouse.y * 1.4 - camera.position.y) * .04;
            camera.position.z = 11 - imageBurst * 1.6;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(loop);
        }

        function ajustar() {
            const w = innerWidth, h = innerHeight;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            world.position.x = w < 860 ? 0 : 2.2; // deixa espaço para o painel
            world.scale.setScalar(w < 860 ? .6 : 1);
        }
        addEventListener('resize', ajustar);
        ajustar();
        loop();
        }

        /* ====== Interface ====== */
        const $ = id => document.getElementById(id);
        const led = $('led'), estado = $('estado'), alvo = $('alvo'), codigo = $('codigo'), resultado = $('resultado');
        const botoes = document.querySelectorAll('button[data-file]');
        let digitando = 0;

        function setEstado(texto, ocupado) {
            estado.textContent = texto;
            led.classList.toggle('busy', ocupado);
        }

        function digitar(texto) {
            clearInterval(digitando);
            resultado.textContent = '';
            resultado.classList.add('caret');
            let i = 0;
            digitando = setInterval(() => {
                resultado.textContent = texto.slice(0, ++i);
                if (i >= texto.length) { clearInterval(digitando); resultado.classList.remove('caret'); }
            }, 28);
        }

        function buscar(arquivo) {
            botoes.forEach(b => b.disabled = true);
            alvo.textContent = 'GET ' + arquivo;
            codigo.textContent = 'enviando…'; codigo.className = 'status';
            resultado.textContent = '';
            setEstado('REQUISIÇÃO EM TRÂNSITO', true);

            const t0 = performance.now();
            const dados = fetch(arquivo).then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
            });

            animarRequisicao(() => {
                dados.then(txt => {
                    codigo.textContent = '200 OK · ' + Math.round(performance.now() - t0) + ' ms';
                    codigo.className = 'status ok';
                    digitar(txt.trim());
                }).catch(err => {
                    console.error('Erro:', err);
                    codigo.textContent = 'falhou'; codigo.className = 'status err';
                    resultado.textContent = 'Não foi possível ler ' + arquivo + '. Abra a página por um servidor local (ex.: python3 -m http.server).';
                }).finally(() => {
                    botoes.forEach(b => b.disabled = false);
                    setEstado('PRONTO PARA REQUISITAR', false);
                });
            });
        }
        botoes.forEach(b => b.addEventListener('click', () => buscar(b.dataset.file)));

        /* ====== Imagem ====== */
        const foto = $('foto'), frame = $('frame'), stageEl = frame.parentElement, btnImagem = $('btnImagem');
        let aberta = false;

        function abrirImagem() {
            if (aberta) return;
            aberta = true;
            foto.classList.remove('hide', 'missing');
            foto.style.backgroundImage = 'url("' + ARQUIVO_IMAGEM + '")';
            const teste = new Image();
            teste.onerror = () => { foto.classList.add('missing'); foto.style.backgroundImage = 'none'; };
            teste.src = ARQUIVO_IMAGEM;
            void foto.offsetWidth; // reinicia a animação
            frame.classList.remove('off'); frame.classList.add('on');
            foto.classList.add('show');
            explosaoImagem();
            btnImagem.querySelector('.label').textContent = 'Ocultar imagem';
        }
        function fecharImagem() {
            if (!aberta) return;
            aberta = false;
            foto.classList.remove('show');
            foto.classList.add('hide');
            frame.classList.add('off');
            setTimeout(() => { if (!aberta) frame.classList.remove('on', 'off'); }, 500);
            stageEl.style.transform = '';
            btnImagem.querySelector('.label').textContent = 'Mostrar imagem';
        }
        btnImagem.addEventListener('click', () => aberta ? fecharImagem() : abrirImagem());
        $('fechar').addEventListener('click', fecharImagem);
        addEventListener('keydown', e => { if (e.key === 'Escape') fecharImagem(); });

        // inclinação 3D da imagem seguindo o cursor
        foto.addEventListener('pointermove', e => {
            if (!aberta) return;
            const r = foto.getBoundingClientRect(), st = stageEl;
            const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
            st.style.transform = `perspective(1200px) rotateY(${x * 14}deg) rotateX(${-y * 14}deg)`;
        });
        foto.addEventListener('pointerleave', () => { stageEl.style.transform = ''; });
    </script>
</body>
</html>
